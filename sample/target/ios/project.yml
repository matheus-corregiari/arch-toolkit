name: Showcase
options:
  bundleIdPrefix: br.com.arch.toolkit
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  Showcase:
    type: application
    platform: iOS
    sources:
      - ShowcaseApp.swift
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Arch Toolkit Showcase
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: br.com.arch.toolkit.showcase
            CFBundleURLSchemes: [archtoolkit]
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_MODULE_NAME: ShowcaseHost
        PRODUCT_BUNDLE_IDENTIFIER: br.com.arch.toolkit.showcase
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../../shared/app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Showcase -lsqlite3"
    preBuildScripts:
      - name: Build shared Kotlin framework
        script: |
          cd "$SRCROOT/../../.."
          ./gradlew :sample:shared:app:embedAndSignAppleFrameworkForXcode -PincludeSamples -PreleaseVersion=2.0.0-rc19
        basedOnDependencyAnalysis: false
schemes:
  Showcase:
    build:
      targets:
        Showcase: all
