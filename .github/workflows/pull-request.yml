name: Pull Request

on:
  pull_request:
    branches: [master]
    types: [synchronize, opened, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-gradle
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: python -m pip install -r .github/requirements-docs.txt
      - name: Build, test and lint all configured targets and samples
        run: ./gradlew ciBuild ciTest ciCoverage ciLint ciDocs ciPublicationManifest -PincludeSamples -PreleaseVersion=2.0.0-rc18 --continue --no-daemon
      - name: Verify documentation
        run: python -m mkdocs build --strict
