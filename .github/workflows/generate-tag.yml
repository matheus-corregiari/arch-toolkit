name: Master Release

on:
  pull_request:
    branches:
      - master
    types:
      - closed
  workflow_dispatch:
    inputs:
      release_branch:
        description: Release branch name, such as release/2.0.0-rc19
        required: true
        type: string
      commit_sha:
        description: Exact master commit to release
        required: true
        type: string

concurrency:
  group: master-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Tag and publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'release/') ||
      startsWith(github.event.pull_request.head.ref, 'hotfix/')))
    runs-on: macos-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout master
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          RELEASE_BRANCH: ${{ inputs.release_branch || github.event.pull_request.head.ref }}
        run: |
          chmod +x .github/scripts/release-version.sh
          .github/scripts/release-version.sh "$RELEASE_BRANCH"

      - name: Base Setup
        uses: ./.github/actions/setup-gradle

      - name: Version Name
        uses: ./.github/actions/version-name
        with:
          version: ${{ steps.version.outputs.version }}
          ossrh_username: ${{ secrets.OSSRH_USERNAME }}
          ossrh_password: ${{ secrets.OSSRH_PASSWORD }}
          mavencentral_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          mavencentral_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          sign_keyid: ${{ secrets.SIGN_KEYID }}
          sign_password: ${{ secrets.SIGN_PASSWORD }}
          sign_filename: ${{ secrets.SIGN_FILENAME }}

      - name: Build publishable modules and generate coverage
        run: ./gradlew ciBuild ciCoverage

      - name: Report coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          disable_search: true
          fail_ci_if_error: false

      - name: Publish modules
        run: ./gradlew ciPublishMavenCentral

      - name: Push release tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"
          if ! git rev-parse "refs/tags/${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            git tag -a "${{ steps.version.outputs.version }}" -m "${{ steps.version.outputs.version }}"
          fi
          git push origin "${{ steps.version.outputs.version }}"

      - name: Select curated release notes
        id: notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          : > "$notes"
          if [ -f .github/scripts/extract-release-notes.py ]; then
            python3 .github/scripts/extract-release-notes.py "$RELEASE_VERSION" docs/CHANGELOG.md "$notes"
          fi
          if [ -s "$notes" ]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Arch Toolkit ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
