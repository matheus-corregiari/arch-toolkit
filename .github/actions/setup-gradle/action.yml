name: "Configure Java and Gradle"
description: "Boilerplate steps"
runs:
  using: "composite"
  steps:

    - name: set up JDK 21
      uses: actions/setup-java@v6.0.1
      with:
        java-version: 21
        distribution: temurin

    # Setup Gradle because without it, nothing happens
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.4.0
      with:
        cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4.0.4
      with:
        packages: platform-tools

    - name: Install configured Android platform and Build Tools
      shell: bash
      run: |
        compile_sdk=$(sed -n 's/^build-sdk-compile = "\(.*\)"/\1/p' gradle/libs.versions.toml)
        build_tools=$(sed -n 's/^build-tools = "\(.*\)"/\1/p' gradle/libs.versions.toml)
        sdkmanager "platforms;android-$compile_sdk" "build-tools;$build_tools"

    # Cache Konan (Kotlin/Native)
    - name: Cache Konan
      uses: actions/cache@v6.1.0
      with:
        path: ~/.konan
        key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-konan-

    # Cache npm (for JS/WASM builds)
    - name: Cache npm
      uses: actions/cache@v6.1.0
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json') }}
        restore-keys: ${{ runner.os }}-npm-
